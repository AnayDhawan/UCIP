[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucip"
version = "0.1.0"
description = "Client for the UCIP API: Mumbai ward-level heat vulnerability data and cited nature-based cooling recommendations, as pandas and geopandas frames."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anay Dhawan" }]
keywords = [
    "heat-vulnerability",
    "urban-heat",
    "climate",
    "geospatial",
    "geopandas",
    "mumbai",
    "open-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]

# pandas and geopandas are required, not extras. The package exists so that
# three lines give a researcher a GeoDataFrame; putting the geometry behind an
# extras flag would add friction aimed at precisely the audience it is for.
# They are imported lazily, so `import ucip` does not pay for GDAL bindings.
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "geopandas>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "responses>=0.24",
]

[project.urls]
Homepage = "https://uciplatform.vercel.app"
Documentation = "https://github.com/AnayDhawan/UCIP/tree/main/clients/python"
Repository = "https://github.com/AnayDhawan/UCIP"
Issues = "https://github.com/AnayDhawan/UCIP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ucip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
