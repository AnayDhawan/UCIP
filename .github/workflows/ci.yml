name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Production tree only: shadcn is a build-time dev dependency, so its
      # transitive advisories do not ship. Critical findings fail the build.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present

  # The published TypeScript client (issue #103). Its response types are
  # generated from the same spec module the API serves, so the check that
  # matters is that regenerating them changes nothing: if it does, the API
  # moved and the client was not rebuilt, which is exactly the silent rot the
  # issue asked to prevent. The frontend job above covers the other half, since
  # its route handlers typecheck against these types.
  client-typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "24"]
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm ci
      - run: npm run generate
      - name: Fail if the generated types are stale
        if: matrix.node-version == '24'
        run: |
          if ! git diff --exit-code -- src/types.gen.ts; then
            echo "::error::src/types.gen.ts is out of date. Run 'npm run generate' in clients/typescript and commit the result."
            exit 1
          fi
      - name: Build the client
        run: |
          if [ "${{ matrix.node-version }}" = "18" ]; then
            npx tsc -p tsconfig.json
          else
            npx tsc -p tsconfig.json --noEmit
          fi
      - name: Smoke-test the built package on Node 18
        if: matrix.node-version == '18'
        run: node --input-type=module -e "import('./dist/index.js').then(({ UcipClient }) => { if (typeof UcipClient !== 'function') process.exit(1); })"
      - name: Run the full test suite
        if: matrix.node-version == '24'
        run: npm test
      - name: Fail if the committed spec artifact is stale
        if: matrix.node-version == '24'
        working-directory: .
        run: |
          if ! git diff --exit-code -- clients/openapi.json; then
            echo "::error::clients/openapi.json is out of date. Run 'npm run generate' in clients/typescript and commit the result."
            exit 1
          fi

  # The published Python client (issue #104). Same rot check as the TypeScript
  # one: its models are generated from clients/openapi.json, so regenerating
  # them must be a no-op. This job runs after the TypeScript job has proved the
  # artifact itself is current.
  client-python:
    runs-on: ubuntu-latest
    needs: client-typescript
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Check generated models are current
        if: matrix.python-version == '3.12'
        run: python scripts/generate.py
      - name: Fail if the generated models are stale
        if: matrix.python-version == '3.12'
        run: |
          if ! git diff --exit-code -- src/ucip/models.py; then
            echo "::error::src/ucip/models.py is out of date. Run 'python scripts/generate.py' in clients/python and commit the result."
            exit 1
          fi
      - run: python -m pytest tests/ -q

  # The geospatial stages (issue #207). The job below installs only
  # requirements-dev.txt, so every test that needs geopandas skips there and
  # stages 01, 03, 04, 05 and 06 were exercised only by the live refresh against
  # Earth Engine: a regression surfaced as a failed Tuesday run rather than a
  # failed pull request. This job installs the credential-free geospatial stack
  # and runs them for real on a three-ward fixture city, with the Earth Engine
  # and OpenStreetMap calls stubbed at the function boundary. No credentials, no
  # network, a few seconds of test time.
  pipeline-geospatial:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pipeline/requirements-geo.txt
      - run: pip install -r pipeline/requirements-geo.txt
      - name: Run the pipeline tests with geopandas present
        # -rs lists skips, so a test that silently stops running shows up in the log.
        run: pytest pipeline/tests/ -rs

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # requirements-dev.txt only, not requirements.txt's full geospatial/GEE stack
      # (geopandas, rasterio, osmnx, scikit-learn, scipy, matplotlib, supabase) --
      # pipeline/tests/ doesn't need any of that. It DOES need earthengine-api and
      # cryptography (both in requirements-dev.txt) for test_gee_auth.py, which
      # covers _gee_auth.py's credential-routing logic -- the highest-risk new code
      # in the pipeline orchestration work, and worth actually running here rather
      # than only locally. No real GEE credentials or network calls are used;
      # ee.Initialize is monkeypatched in every test.
      - run: pip install -r pipeline/requirements-dev.txt
      - run: pytest pipeline/tests/

      # City configs are validated on every push (issue #68). A malformed config
      # should fail here in seconds rather than forty minutes into an Earth
      # Engine run that then writes half a dataset. Geometry checks are skipped
      # when a boundary file is absent, since geopandas is not installed in this
      # job; the structural checks (bbox ordering, slug/filename agreement,
      # map centre inside the bbox, UTM zone matching the bbox) all still run.
      - run: python pipeline/validate_cities.py --allow-missing-data

      # The frontend bundles a mirror of config/cities/ (Turbopack cannot import
      # from outside the Next.js root). Fail if it has drifted, so the site can
      # never show a different map centre from the one the pipeline validated
      # its grid against.
      - run: python pipeline/sync_city_config.py --check
