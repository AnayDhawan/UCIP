# Publish the TypeScript client to npm (issue #103).
#
# The client lives in clients/typescript, is generated from the API's OpenAPI
# spec, and is already held to the API by CI: the generated types must be
# current, and the frontend's route handlers typecheck against them
# (frontend/src/app/api/v1/contract.test.ts). What was missing was the last
# step, getting it onto npm.
#
# Trigger: push a tag named ts-client-v<version>, e.g. ts-client-v0.1.0. The tag
# must match the version in clients/typescript/package.json, so a tag cannot
# publish a different number from the one that was reviewed. Separate from the
# v* tags that cut a dataset release (release.yml): the client versions on its
# own schedule.
#
# Needs a repo secret NPM_TOKEN: an npm automation token with publish rights to
# the package name. Until it is set the final step fails with a clear message and
# nothing is published. --provenance links the package to this workflow run.

name: Publish TypeScript client

on:
  push:
    tags:
      - "ts-client-v*"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, for the ancestry check below.
          fetch-depth: 0

      - name: Check the tagged commit is on main
        # A tag can be pushed to any commit, including one on an unreviewed
        # branch. Only what has reached main may be published.
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main. Merge it first, then tag."
            exit 1
          fi
        working-directory: .

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "ts-client-v${version}" ]; then
            echo "::error::Tag $TAG does not match package.json version ${version}."
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs `npm run build` (which regenerates the types from the
      # spec) and `npm test`; running them here too fails the job before the
      # publish step rather than inside it.
      - run: npm run build
      - run: npm test

      - name: Fail if the generated types are stale
        run: |
          if ! git diff --exit-code -- src/types.gen.ts ../openapi.json; then
            echo "::error::Generated files are out of date. Run 'npm run generate' and commit the result."
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set, so nothing was published. Add an npm automation token as the NPM_TOKEN repo secret and re-run."
            exit 1
          fi
          npm publish --provenance --access public
