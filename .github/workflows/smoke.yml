# Live-site smoke test.
#
# Why this exists: the production deployment 404'd on every route for roughly a
# month (the Vercel Root Directory field pointed at the repo root instead of
# frontend/) and nothing caught it. The README badge said "prototype-live", the
# repo homepage linked straight at the dead URL, and CI stayed green the whole
# time, because CI only ever built the site, it never fetched it.
#
# So this checks the thing CI structurally cannot: that the deployed site is
# actually serving. A build that passes and a site that responds are different
# claims.
#
# Config: repo variable LIVE_URL (Settings > Secrets and variables > Actions >
# Variables), no trailing slash. Not a secret, the URL is public.

name: Smoke

on:
  schedule:
    # Every 6 hours, offset off the hour to dodge GitHub's :00 cron stampede.
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Forks have no LIVE_URL, Supabase secrets or issues tab, so scheduled runs there only fail.
    if: github.repository == 'AnayDhawan/UCIP'
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site responds
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          set -uo pipefail
          # The API paths below contain '?', which the shell would otherwise try to glob.
          set -f

          if [ -z "${LIVE_URL:-}" ]; then
            echo "::error::LIVE_URL repo variable is not set. Set it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          # One page per major surface, plus a data file. The data file matters
          # on its own: the dashboard reads its GeoJSON from /public at runtime,
          # so the HTML can render fine while the map silently has nothing to draw.
          #
          # The API and an embed card ship in the same deploy as the pages, and
          # clients and the MCP server depend on them (issue #209). A broken API
          # route would otherwise pass this job.
          PATHS="/ /dashboard /methodology /simulate /wards_hvi.geojson /nbs_recommendations.json /api/v1/meta /api/v1/wards?limit=24 /api/v1/wards/C /embed/ward/C"

          failed=0
          for path in $PATHS; do
            url="${LIVE_URL}${path}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 --retry 2 --retry-delay 5 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "ok    $code  $url"
            else
              echo "::error::$code $url"
              failed=1
            fi
          done

          # Status codes alone do not catch an API that answers 200 with the wrong
          # data. All 24 wards must come back. A snapshot fallback is intentional
          # behaviour, so it is surfaced as a warning rather than a failure.
          wards=$(curl -sS --max-time 30 --retry 2 --retry-delay 5 "${LIVE_URL}/api/v1/wards" || echo "")
          count=$(printf '%s' "$wards" | jq -r '.count // empty' 2>/dev/null || echo "")
          source=$(printf '%s' "$wards" | jq -r '.source // empty' 2>/dev/null || echo "")
          if [ "$count" = "24" ]; then
            echo "ok    /api/v1/wards returned 24 wards (source: ${source:-unknown})"
          else
            echo "::error::/api/v1/wards returned count '${count:-none}', expected 24"
            failed=1
          fi
          if [ "$source" = "snapshot" ]; then
            echo "::warning::/api/v1/wards is served from the committed snapshot, not the database"
          fi

          exit $failed
