# Scheduled data refresh (issue #58). Runs Tuesdays and Fridays.
#
# The underlying data is satellite- and WorldPop-driven and changes monthly at
# best, which is why this was monthly originally (issue #57,
# pipeline/README.md#refresh-cadence-issue-57). It is twice weekly now by
# explicit request, so that the database stays demonstrably live and the
# published data is never more than a few days from a verified run. The cost
# and what absorbs it are noted on the schedule below.
#
# Live weather is intentionally NOT run from here: it is fetched client-side
# per page load by frontend/src/lib/weather.ts and needs no cron.
#
# Required repo secrets, all configured:
#   GEE_PROJECT                 Earth Engine project id (see .env.example)
#   GEE_SERVICE_ACCOUNT_JSON    Full service-account key JSON (see pipeline/_gee_auth.py)
#
# This workflow does NOT write the database (issue #218). The Supabase secrets
# are deliberately not passed to the pipeline step, so stage 07 writes the
# committed snapshots and skips Supabase. The database is published from main
# by supabase-sync.yml, which also fires when a refresh PR merges. The order is
# therefore: run, gate, diff, decide whether the change is material (#205),
# open a PR, review and merge, then deploy and sync the database. Before this a
# refresh loaded Supabase in the same step that ran the pipeline, ahead of the
# quality gate and of any review, so a rejected run or an unmerged PR had
# already changed what the API served.
#
# Not every run opens a PR (issue #205). The run log is rewritten on every run
# with timestamps and stage timings, and a real run moves the scores slightly,
# so "byte-identical" never happens. The "Decide whether the refresh is
# material" step compares the diff against a threshold and, if nothing
# meaningful moved, restores data/ and frontend/public/ and skips the PR.
#
# Diff baseline (issue #126): a refresh diffs its output against the LAST refresh
# that actually landed, never against whatever happens to sit on main — see the
# "Snapshot pre-refresh data/" step below, which picks, in order:
#   1. origin/automated/pipeline-refresh  — a previous refresh whose PR is still
#      open. Diffing against it means a run that fires before the previous PR
#      merges produces non-overlapping changes instead of re-diffing against the
#      same stale baseline.
#   2. the data-refresh-baseline tag       — the last refresh that MERGED. The tag
#      is moved by refresh-baseline-tag.yml whenever an automated refresh PR
#      merges, so a run never attributes human data edits made between refreshes
#      to the pipeline.
#   3. main itself                        — only when neither exists yet (first run).
# This used to be "copy data/" plain, which double-counted changes from an open
# refresh PR; fixed by refresh-baseline-tag.yml (issue #126).

name: Pipeline refresh

on:
  schedule:
    # Tuesdays and Fridays, 03:17 UTC. Off the top of the hour on purpose,
    # to avoid piling onto GitHub's :00 cron stampede on shared runners.
    #
    # Twice weekly rather than monthly, by explicit request. Read the cadence
    # note above before changing this again: within a dry season the composite
    # window is fixed, so most of these runs refetch identical imagery and
    # produce identical numbers. That is not wasted in the sense of being
    # wrong, and it is not free either: every run spends Earth Engine quota,
    # which usage-report.yml now tracks (#130) and the composite cache in #93
    # would largely eliminate.
    #
    # Two things stop the extra frequency creating noise. The quality gate
    # (#91) fails a run whose output is implausible rather than opening a pull
    # request for it, and the materiality step (#205) skips the PR when no rank,
    # recommendation or green-cover class changed and no ward's HVI moved by more
    # than HVI_MATERIAL_DELTA (pipeline/diff_snapshots.py). create-pull-request's
    # own "nothing to commit" check cannot do this job: the run log changes on
    # every run, so the tree is never clean.
    - cron: "17 3 * * 2,5"
  workflow_dispatch:
    inputs:
      force_pr:
        description: "Open the refresh PR even when nothing material changed (for example after a change that renumbers ids or adds columns, which the materiality check cannot see)"
        type: boolean
        default: false
      include_spike:
        description: "Also run 00_gee_spike.py as a GEE connectivity smoke test"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pipeline-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Forks have no LIVE_URL, Supabase secrets or issues tab, so scheduled runs there only fail.
    if: github.repository == 'AnayDhawan/UCIP'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff baseline below can be any earlier commit or tag (git
          # fetch --tags, then git archive of it), so the default shallow
          # depth-1 clone is not enough — fetch full history once.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Snapshot pre-refresh data/ as the diff baseline
        # diff_snapshots.py (#61) needs the PREVIOUS run's output to compare
        # against. "Previous" is decided by refresh-baseline-tag.yml (issue
        # #126), not by the state of main: see the header comment above. The
        # baseline is materialised into data-baseline/ via git archive so this
        # step never touches the working data/ files the pipeline is about to
        # regenerate.
        run: |
          rm -rf data-baseline
          git fetch --tags --force --quiet origin
          # Priority 1 needs a real remote-tracking ref, but actions/checkout
          # configures a single-branch refspec (only main is tracked), so a
          # plain `git fetch origin automated/pipeline-refresh` would write
          # FETCH_HEAD and nothing else and the rev-parse below could never
          # fire. Fetch into the tracking ref explicitly instead (issue #126).
          # Caveat: if the previous refresh PR is ever closed WITHOUT merging,
          # its branch can be left behind and would keep being preferred here
          # even though it never landed. Benign in practice — the next refresh
          # that actually merges force-moves the tag and delete-branch removes
          # the branch — but it means one diff is computed against an unmerged
          # refresh.
          git fetch --quiet origin '+refs/heads/automated/pipeline-refresh:refs/remotes/origin/automated/pipeline-refresh' || true
          if git rev-parse --quiet --verify origin/automated/pipeline-refresh > /dev/null 2>&1; then
            BASELINE_REF=origin/automated/pipeline-refresh
            echo "Diff baseline: open refresh branch (previous refresh not merged yet)"
          elif git rev-parse --quiet --verify refs/tags/data-refresh-baseline > /dev/null 2>&1; then
            BASELINE_REF=data-refresh-baseline
            echo "Diff baseline: last merged refresh (tag data-refresh-baseline)"
          else
            echo "Diff baseline: current main (first run, no merged refresh yet)"
            cp -r data data-baseline
            exit 0
          fi
          mkdir -p data-baseline
          git archive --format=tar "$BASELINE_REF" data \
            | tar -x -C data-baseline --strip-components=1

      - name: Resolve GEE_PROJECT
        # An unconfigured secrets.* reference substitutes as an empty string, not as
        # "absent". Every GEE-calling script resolves its project id with
        # os.environ.get("GEE_PROJECT", "<its own hardcoded default>"), which only
        # falls back when the variable is genuinely UNSET -- an env var explicitly set
        # to "" still counts as present and defeats that fallback, which would send an
        # empty project id to Earth Engine on the very first scheduled run after
        # GEE_SERVICE_ACCOUNT_JSON is configured but GEE_PROJECT is not. Only export
        # GEE_PROJECT here when the secret is actually non-empty, so an unconfigured
        # secret leaves it genuinely unset and each script's own default applies.
        run: |
          if [ -n "${{ secrets.GEE_PROJECT }}" ]; then
            echo "GEE_PROJECT=${{ secrets.GEE_PROJECT }}" >> "$GITHUB_ENV"
          fi

      - name: Run orchestrated pipeline
        working-directory: pipeline
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          # No Supabase variables here, on purpose (issue #218): without them
          # 07_load.py writes the snapshots and skips the database. The database
          # is published from main by supabase-sync.yml after the PR merges.
        # inputs.include_spike only exists on a workflow_dispatch run; on the schedule
        # trigger there are no inputs at all, so a bare `inputs.include_spike` reads as
        # empty rather than the declared "false" default. That happens to still take
        # the "else" branch below, but only by coincidence of empty-string comparison,
        # not because the schedule trigger was ever meant to route through this input.
        # Gating on github.event_name makes the schedule path explicit instead of
        # accidental.
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.include_spike }}" = "true" ]; then
            python run_pipeline.py --include-spike
          else
            python run_pipeline.py
          fi

      - name: Gate the refresh on plausible output
        # Runs before the diff and the PR, because the point is to stop a broken
        # refresh from being published at all (issue #91). Stages emit their own
        # warnings, but nothing checked the finished dataset as a whole, so a
        # run that produced wrong-but-well-formed data looked exactly like a
        # good one and this workflow would have opened a PR for it.
        #
        # Exit 1 fails the job. Exit 2 means the inputs were not there to check,
        # which the pipeline step above would already have failed on.
        working-directory: pipeline
        run: python quality_gate.py --baseline-dir ../data-baseline

      - name: Compute alert-worthy diff against the previous run
        id: diff
        working-directory: pipeline
        run: |
          python diff_snapshots.py \
            --old-dir ../data-baseline \
            --new-dir ../data \
            --out ../data/pipeline_diff.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload run log and diff as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-refresh-${{ github.run_id }}
          path: |
            data/pipeline_run_log.json
            data/pipeline_diff.json
          if-no-files-found: warn

      - name: Skip the refresh when nothing material changed
        # See the header (issue #205). The diff step decided; this restores the
        # tracked and untracked files the pipeline wrote so the working tree is
        # clean, which also keeps a no-op run from leaving anything behind for
        # create-pull-request to commit. The diff and run log were uploaded above.
        if: steps.diff.outputs.material != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.force_pr)
        env:
          REASONS: ${{ steps.diff.outputs.reasons }}
        run: |
          git checkout -- data frontend/public
          git clean -fdq -- data frontend/public
          echo "No material change: ${REASONS}. No PR opened." | tee -a "$GITHUB_STEP_SUMMARY"
          git status --short

      - name: Build PR body from the diff summary
        if: steps.diff.outputs.material == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_pr)
        id: diff_summary
        run: |
          echo "body<<PR_BODY_EOF" >> "$GITHUB_OUTPUT"
          echo "Automated monthly pipeline refresh (schedule: \`17 3 1 * *\`, UTC)." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          python pipeline/format_diff_summary.py data/pipeline_diff.json >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## Scope" >> "$GITHUB_OUTPUT"
          echo "- This PR contains only regenerated pipeline output (data/, frontend/public/)." >> "$GITHUB_OUTPUT"
          echo "- Per-user \"saved ward\" alert filtering and email delivery are out of scope pending issue #59." >> "$GITHUB_OUTPUT"
          echo "PR_BODY_EOF" >> "$GITHUB_OUTPUT"

      - name: Open a PR with the refreshed data
        if: steps.diff.outputs.material == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_pr)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(pipeline): monthly automated data refresh"
          branch: automated/pipeline-refresh
          delete-branch: true
          title: "Automated monthly pipeline refresh"
          body: ${{ steps.diff_summary.outputs.body }}
          labels: automated,data-refresh
          # Every extension the pipeline actually writes into frontend/public/ (see
          # pipeline/README.md's "Frontend sync" table): *.json alone used to miss the
          # .geojson layers (wards_hvi, cells_nbs, cells_ndvi_change) and the
          # sensitivity chart .png this same PR added, which would have made every
          # scheduled refresh silently commit nbs_recommendations.json while leaving
          # the map/NBS/NDVI-change layers and the chart stale indefinitely. Matching
          # unrelated static assets (logos, icons, robots.txt) under these globs is
          # harmless: add-paths only stages files git already sees as changed, and the
          # pipeline never touches those.
          add-paths: |
            data/**
            frontend/public/*.json
            frontend/public/*.geojson
            frontend/public/*.png
